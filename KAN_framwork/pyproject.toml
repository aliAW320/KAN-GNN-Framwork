[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kangnn"
version = "0.1.0"
description = "Composable KAN and MLP graph neural networks for PyTorch Geometric"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "torch-geometric>=2.6,<3", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
kangnn = "kangnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
