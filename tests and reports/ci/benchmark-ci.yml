# Template: copy to the repository's .github/workflows/ to activate.
# Kept here to satisfy the requirement that new code stays in this directory.
name: Benchmark architecture tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-geometric==2.6.1
          python -m pip install -e './KAN_framwork[test]' -e './tests and reports[test]'
      - name: Test every independent eligible architecture
        run: |
          ruff check 'tests and reports'
          pytest 'tests and reports/tests' -q --cov=gnn_benchmark --cov-fail-under=90
