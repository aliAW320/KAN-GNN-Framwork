name: KAN-GNN tests and packages
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kangnn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
    defaults:
      run:
        working-directory: KAN_framwork
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: KAN_framwork/pyproject.toml
      - name: Install CPU dependencies and framework
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-geometric==2.6.1
          python -m pip install -e '.[test]'
      - name: Lint
        run: ruff check .
      - name: Deterministic tests
        run: pytest --cov=kangnn --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Run documented examples
        run: |
          kangnn --config examples/mixed.json --epochs 10
          python examples/custom_extensions.py
          python examples/skan_style.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: KAN_framwork/coverage.xml
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distribution
        run: |
          python -m pip install build twine
          python -m build KAN_framwork
          python -m twine check KAN_framwork/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: kangnn-distribution
          path: KAN_framwork/dist/*
