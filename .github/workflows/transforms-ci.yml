name: Mathematical transforms
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            mathematical_transforms/pyproject.toml
            KAN_framwork/pyproject.toml
      - name: Install CPU backend and both packages
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-geometric==2.6.1
          python -m pip install -e './KAN_framwork[test]' -e './mathematical_transforms[test]' build
      - name: Lint and test transforms with graph integration
        run: |
          ruff check mathematical_transforms
          pytest mathematical_transforms/tests --cov=kan_transforms --cov-report=term-missing --cov-report=xml:mathematical_transforms/coverage.xml --cov-fail-under=90
      - name: Run examples and verify original framework
        run: |
          python mathematical_transforms/examples/numerical.py
          python mathematical_transforms/examples/kan_integration.py
          pytest KAN_framwork/tests -q
      - name: Build separate transform distribution
        run: python -m build mathematical_transforms
      - uses: actions/upload-artifact@v4
        with:
          name: mathematical-transforms-python-${{ matrix.python }}
          path: |
            mathematical_transforms/dist/*
            mathematical_transforms/coverage.xml
