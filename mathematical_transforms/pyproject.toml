[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kan-transforms"
version = "0.1.0"
description = "Differentiable sampled transforms and transform-inspired KAN bases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
